<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#C75B20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ustam Oto"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Ustam Oto</title><style>
:root{--orange:#C75B20;--bg:#FFF9F4;--dark:#2E241F;--muted:#7D6E65;--card:#fff;--line:#E9DDD5;--soft:#F4E3D7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{border:0}.app{min-height:100vh;padding-bottom:86px}.header{padding:calc(env(safe-area-inset-top) + 24px) 22px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--orange)}h1{font-size:32px;margin:4px 0 0;font-weight:900}.sub{color:var(--muted);font-size:14px;margin-top:4px}.logo{width:48px;height:48px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:22px}.content{padding:12px 18px 110px}.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:12px;display:flex;gap:10px;box-shadow:0 4px 18px rgba(46,36,31,.05)}.timebox{width:58px;text-align:center;flex:none}.time{font-weight:900;font-size:17px}.dot{color:var(--orange);font-size:9px}.cardmain{flex:1;min-width:0}.cardtitle{font-size:17px;font-weight:800}.meta,.note{font-size:13px;color:var(--muted);margin-top:5px}.note{color:#62564F;margin-top:7px}.actions{display:flex;gap:5px;align-items:flex-start}.iconbtn{background:none;color:#A6968C;padding:5px;font-size:18px}.empty{text-align:center;padding:50px 25px}.emptyicon{font-size:38px;color:var(--orange)}.emptytitle{font-size:18px;font-weight:800;margin-top:10px}.fab{position:fixed;right:20px;bottom:78px;width:60px;height:60px;border-radius:50%;background:var(--orange);color:white;font-size:32px;box-shadow:0 8px 22px rgba(199,91,32,.3);z-index:10}.tabs{position:fixed;left:0;right:0;bottom:0;height:72px;padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #F1E7DF;display:flex;z-index:9}.tab{flex:1;background:white;color:#9B8E85;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tab.active{color:var(--orange)}.tab span:first-child{font-size:20px}.search{margin:0 18px 8px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px 14px;display:flex;gap:8px}.search input{border:0;outline:0;flex:1;background:transparent}.date{font-size:14px;font-weight:800;color:var(--orange);margin:12px 0 7px;text-transform:capitalize}.calnav{display:flex;justify-content:space-between;align-items:center;padding:0 25px 10px}.arrow{background:none;color:var(--orange);font-size:34px}.month{font-weight:900;font-size:18px;text-transform:capitalize}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);padding:0 14px}.week div{text-align:center;color:var(--muted);font-size:12px;font-weight:800;padding:6px}.day{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;position:relative;font-weight:700}.day.active{background:var(--orange);color:#fff}.badge{position:absolute;bottom:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--soft);color:var(--orange);font-size:9px;display:grid;place-items:center}.day.active .badge{background:#fff}.modal{position:fixed;inset:0;background:rgba(30,20,15,.38);display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:var(--bg);width:100%;max-height:94vh;border-radius:28px 28px 0 0;padding:20px 22px calc(20px + env(safe-area-inset-bottom));overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h2{margin:0;font-size:25px}.close{background:none;font-size:32px;color:var(--muted)}label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:13px 0 6px}input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;color:var(--dark);outline:none}textarea{min-height:90px;resize:none}.save{width:100%;background:var(--orange);color:#fff;border-radius:14px;padding:16px;margin-top:20px;font-weight:900}.install{margin:0 18px 12px;padding:13px 15px;background:var(--soft);border-radius:15px;color:var(--dark);display:none;justify-content:space-between;align-items:center;font-size:13px}.install button{background:var(--orange);color:#fff;border-radius:10px;padding:8px 11px;font-weight:800}.hidden{display:none!important}
</style></head><body><div id="app" class="app"></div><div id="modal" class="modal"></div><script>
const ORANGE='#C75B20',KEY='ustam_oto_items_v1';let items=JSON.parse(localStorage.getItem(KEY)||'[]'),view='today',selected=new Date(),search='';
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=iso(new Date());
const fmt=s=>new Date(s+'T00:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});
const save=()=>localStorage.setItem(KEY,JSON.stringify(items));
function header(title,sub){return `<header class="header"><div><div class="brand">USTAM OTO</div><h1>${title}</h1><div class="sub">${sub}</div></div><div class="logo">🔧</div></header>`}
function card(i){return `<div class="card"><div class="timebox"><div class="time">${i.time||'--:--'}</div><div class="dot">●</div></div><div class="cardmain"><div class="cardtitle">${esc(i.customer)||'Müşteri bilgisi yok'}</div>${i.vehicle?`<div class="meta">🚗 ${esc(i.vehicle)}</div>`:''}${i.phone?`<div class="meta">☎ ${esc(i.phone)}</div>`:''}${i.note?`<div class="note">${esc(i.note)}</div>`:''}</div><div class="actions"><button class="iconbtn" onclick="editItem('${i.id}')">✎</button><button class="iconbtn" onclick="deleteItem('${i.id}')">×</button></div></div>`}
function esc(x=''){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function empty(t){return `<div class="empty"><div class="emptyicon">✓</div><div class="emptytitle">${t}</div><div class="sub">Yeni randevu eklemek için sağ alttaki + butonuna dokunun.</div></div>`}
function tabs(){return `<nav class="tabs"><button class="tab ${view==='today'?'active':''}" onclick="setView('today')"><span>⌂</span>Bugün</button><button class="tab ${view==='calendar'?'active':''}" onclick="setView('calendar')"><span>□</span>Takvim</button><button class="tab ${view==='appointments'?'active':''}" onclick="setView('appointments')"><span>☰</span>Randevular</button></nav>`}
function render(){let body='';if(view==='today')body=todayView();if(view==='calendar')body=calendarView();if(view==='appointments')body=appointmentsView();document.getElementById('app').innerHTML=body+tabs()+`<button class="fab" onclick="openModal()">＋</button>`}
function todayView(){let list=items.filter(i=>i.date===today).sort(sorter);return header('Bugün',new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'}))+`<main class="content">${list.length?list.map(card).join(''):empty('Bugün için randevu yok.')}</main>`}
function sorter(a,b){return (a.date+a.time).localeCompare(b.date+b.time)}
function calendarView(){let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1).getDay(),offset=(first+6)%7,days=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<offset;i++)cells.push('<div></div>');for(let d=1;d<=days;d++){let ds=`${y}-${pad(m+1)}-${pad(d)}`,count=items.filter(x=>x.date===ds).length,active=ds===iso(selected);cells.push(`<button class="day ${active?'active':''}" onclick="pickDate('${ds}')">${d}${count?`<span class="badge">${count}</span>`:''}</button>`)}let list=items.filter(i=>i.date===iso(selected)).sort(sorter);return header('Takvim',selected.toLocaleDateString('tr-TR',{month:'long',year:'numeric'}))+`<div class="calnav"><button class="arrow" onclick="moveMonth(-1)">‹</button><div class="month">${selected.toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}</div><button class="arrow" onclick="moveMonth(1)">›</button></div><div class="week">${['P','S','Ç','P','C','C','P'].map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${cells.join('')}</div><main class="content"><div class="date">${fmt(iso(selected))}</div>${list.length?list.map(card).join(''):empty('Bu gün için randevu yok.')}</main>`}
function appointmentListHtml(){let list=items.filter(i=>[i.customer,i.vehicle,i.phone,i.note].join(' ').toLowerCase().includes(search.toLowerCase())).sort(sorter);let grouped=list.map(i=>`<div class="date">${fmt(i.date)}</div>${card(i)}`).join('');return list.length?grouped:empty('Randevu bulunamadı.')}
function appointmentsView(){return header('Randevular',`${items.length} kayıt`)+`<div class="search">⌕<input id="appointmentSearch" type="search" inputmode="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Müşteri, plaka veya not ara" value="${esc(search)}" oninput="search=this.value;filterAppointments()"></div><main id="appointmentsList" class="content">${appointmentListHtml()}</main>`}
function filterAppointments(){let list=document.getElementById('appointmentsList');if(list)list.innerHTML=appointmentListHtml();}
function setView(v){view=v;render()}function pickDate(s){selected=new Date(s+'T00:00:00');render()}function moveMonth(n){selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);render()}
function openModal(id){let i=id?items.find(x=>x.id===id):null;document.getElementById('modal').innerHTML=`<div class="sheet"><div class="sheethead"><h2>${i?'Randevuyu Düzenle':'Yeni Randevu'}</h2><button class="close" onclick="closeModal()">×</button></div><label>Tarih</label><input id="fdate" type="date" value="${i?.date||today}"><label>Saat</label><input id="ftime" type="time" value="${i?.time||'09:00'}"><label>Müşteri</label><input id="fcustomer" placeholder="Ad Soyad" value="${esc(i?.customer||'')}"><label>Telefon</label><input id="fphone" type="tel" placeholder="05xx xxx xx xx" value="${esc(i?.phone||'')}"><label>Araç</label><input id="fvehicle" placeholder="Plaka / marka-model" value="${esc(i?.vehicle||'')}"><label>Servis notu</label><textarea id="fnote" placeholder="Yapılacak işlem, parça, not...">${esc(i?.note||'')}</textarea><button class="save" onclick="saveItem('${i?.id||''}')">Randevuyu Kaydet</button></div>`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveItem(id){let x={date:fdate.value,time:ftime.value,customer:fcustomer.value.trim(),phone:fphone.value.trim(),vehicle:fvehicle.value.trim(),note:fnote.value.trim()};if(!x.date){alert('Tarih seçin.');return}if(id)items=items.map(i=>i.id===id?{...i,...x}:i);else items.push({...x,id:crypto.randomUUID?crypto.randomUUID():Date.now().toString()});items.sort(sorter);save();closeModal();render()}
function editItem(id){openModal(id)}function deleteItem(id){if(confirm('Bu randevu silinsin mi?')){items=items.filter(i=>i.id!==id);save();render()}}
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstall()});function showInstall(){if(document.getElementById('install'))document.getElementById('install').style.display='flex'}
render();if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js?v=3").catch(()=>{});}
</script></body></html>
